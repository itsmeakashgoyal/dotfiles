#
# A channel to select from git branches
[metadata]
name = "git-branch"
description = "A channel to select from git branches"
requirements = ["git"]

[source]
# Local branches by most recent commit, then remote-only branches by plain name
# (`git checkout <name>` / `git switch <name>` then creates the tracking branch).
command = """
{ git for-each-ref --sort=-committerdate --format='%(refname:short)' refs/heads;
  git for-each-ref --sort=-committerdate --format='%(refname:lstrip=3)' --exclude='refs/remotes/*/HEAD' refs/remotes;
} 2>/dev/null | awk 'NF && !seen[$0]++'
"""

[preview]
command = "git log --oneline --graph --color=always -30 '{0}' 2>/dev/null || git log --oneline --graph --color=always -30 'origin/{0}'"

[keybindings]
enter = "actions:checkout"
ctrl-d = "actions:delete"
ctrl-m = "actions:merge"
ctrl-r = "actions:rebase"

[actions.checkout]
description = "Checkout the selected branch"
command = "git checkout '{0}'"
mode = "execute"

[actions.delete]
description = "Delete the selected branch"
command = "git branch -d '{0}'"
mode = "execute"

[actions.merge]
description = "Merge the selected branch into current branch"
command = "git merge '{0}'"
mode = "execute"

[actions.rebase]
description = "Rebase current branch onto the selected branch"
command = "git rebase '{0}'"
mode = "execute"
