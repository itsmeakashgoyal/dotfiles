#
#  ▓▓▓▓▓▓▓▓▓▓
# ░▓ author ▓ Akash Goyal
# ░▓ file   ▓ packages.toml
# ░▓▓▓▓▓▓▓▓▓▓
#
# THE package manifest — single source of truth for every tool this repo
# installs, on every platform, plus the Stow package list.
#
# Nothing here is installed directly. Instead, `dutils manifest generate`
# renders the per-manager package lists into the files that actually run:
#
#   brew         -> brew/Brewfile
#   nix          -> nix/home.nix          (home.packages list)
#   scoop        -> scripts/setup/windows.ps1  ($SCOOP_PACKAGES)
#   apt          -> scripts/setup/linux.sh     (system bootstrap deps)
#   [[stow]]     -> scripts/setup/windows.ps1  ($SYMLINK_MAP) + Makefile
#
# Each of those regions is delimited by BEGIN/END GENERATED markers; everything
# outside the markers stays hand-written. `dutils manifest check` re-renders and
# diffs, so CI fails if a generated region drifts from this file.
#
# ── Adding a tool ─────────────────────────────────────────────────────────────
# Add one [[package]] entry with the name it has in each package manager, run
# `dutils manifest generate`, and commit the result. Omit a manager key when the
# tool isn't available (or isn't wanted) there — e.g. `htop` has no Scoop entry.
#
# ── Fields ────────────────────────────────────────────────────────────────────
#   name      Canonical name (used for sorting, docs and as the default verify)
#   desc      One-line description; becomes the trailing comment in generated files
#   category  Groups entries under a heading in the generated output
#   brew      Homebrew formula name         (macOS; Linux uses Nix, never linuxbrew)
#   brew_os   Restrict the brew entry to "mac" or "linux" (default: both)
#   cask      true => emit as `cask` rather than `brew` (macOS only)
#   nix       nixpkgs attribute name        (Linux)
#   scoop     Scoop app name                (Windows)
#   verify    Executable that proves it's installed; defaults to `name`.
#             Set verify = "" for things that install no command (fonts, libs).
#   critical  true => a missing binary is a hard FAIL in `dutils health/check`
#             rather than a warning. Reserve for things the shell needs to work.
#   check     Health-check tier: "quick" (in `dutils health`), "full" (only in
#             `dutils check`), or "none". Default: "full".
#   version_flag  Flag used to read the version; defaults to "--version"
#

[meta]
version = 1

