# ══════════════════════════════════════════════════════════════════════════════
# Stow packages
#
# `package`  directory in the repo root (also the Stow package name)
# `target`   path the package lands on, relative to $HOME — used by the health
#            check and, on Windows, to build $SYMLINK_MAP
# `source`   path inside the package that `target` points at (defaults to
#            "<package>/<target>")
# `platforms` which OSes stow/link this package. Default: all three.
# `critical` true => a missing symlink is a hard FAIL in `dutils health`
# ══════════════════════════════════════════════════════════════════════════════

[[stow]]
package   = "zsh"
target    = ".zshenv"
source    = "zsh/.zshenv"
desc      = "Zsh entrypoint (the rest lives in .config/zsh)"
platforms = ["macos", "linux"]
critical  = true

[[stow]]
package   = "zsh"
target    = ".config/zsh"
desc      = "Zsh config (conf.d modules, .zshrc)"
platforms = ["macos", "linux"]
critical  = true

[[stow]]
package  = "git"
target   = ".config/git"
desc     = "Git config, aliases, delta, GPG signing"
