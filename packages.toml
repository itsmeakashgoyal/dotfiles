target  = ".config/atuin"
desc    = "Atuin shell history"

[[stow]]
package = "fastfetch"
target  = ".config/fastfetch"
desc    = "Fastfetch system info"

[[stow]]
package = "starship"
target  = ".config/starship"
desc    = "Starship prompt (the default prompt)"

[[stow]]
package = "yazi"
target  = ".config/yazi"
desc    = "Yazi terminal file manager"

[[stow]]
package   = "bin"
target    = ".local/bin"
desc      = "Custom scripts + the dutils CLI on PATH"
