#
#  ▓▓▓▓▓▓▓▓▓▓
# ░▓ author ▓ Akash Goyal
# ░▓ file   ▓ tmux/.config/tmux/tmux.conf
# ░▓▓▓▓▓▓▓▓▓▓
#
# Tmux config: vi-mode, vim-aware pane navigation, TPM plugins (resurrect,
# continuum, sensible), prefix C-a.

#--------------------------------------------------------------------------
# Configuration
#--------------------------------------------------------------------------

# Use Vi mode
setw -g mode-keys vi

# Increase scrollback buffer size
set -g history-limit 10000

# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

# Allow automatic renaming of windows
set -g allow-rename on
# set -g automatic-rename off

# Renumber windows when one is removed.
set -g renumber-windows on

# Improve colors
set -g default-terminal "${TERM}"

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Allow the mouse to resize windows and select tabs
set -g mouse on

# Allow tmux to set the terminal title
set -g set-titles on

# Monitor window activity to display in the status bar
setw -g monitor-activity on

# A bell in another window should cause a bell in the current window
set -g bell-action any

# Don't show distracting notifications
set -g visual-bell off
set -g visual-activity off

# Focus events enabled for terminals that support them
set -g focus-events on

# Useful when using sharing a session with different size terminals
setw -g aggressive-resize on

# don't detach tmux when killing a session
set -g detach-on-destroy off

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

set -as terminal-features ",*:RGB"
# set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
#--------------------------------------------------------------------------
# Status line
#--------------------------------------------------------------------------

# Status line customisation — Gruvbox via ANSI colour indices (not hex), so it
# follows the terminal palette in light and dark mode:
#   colour0 bg · colour8 gray · colour15 fg · colour1 red · colour3 yellow · colour4 blue
#
#    session   1 zsh   2 nvim*                ⎇ main  · 14:05
# Left: session (turns red with "⌃a" while the prefix is pressed). Middle:
# windows, the current one highlighted (Z = zoomed). Right: git branch of the
# current pane (one `git` call per status-interval, run in the background by
# tmux) and the time.
set-option -g status-interval 5
set-option -g status-left-length 40
set-option -g status-right-length 80
set-option -g status-style "fg=colour8,bg=default"
set-option -g status-left "#{?client_prefix,#[fg=colour0#,bg=colour1#,bold] ⌃a ,#[fg=colour0#,bg=colour3#,bold]  #S }#[default]  "
set-option -g status-right '#[fg=colour4]#(b=$(git -C "#{pane_current_path}" branch --show-current 2>/dev/null) && [ -n "$b" ] && printf " %%s" "$b")#[fg=colour8] · %H:%M '

set-option -g window-status-separator ""
set-option -g window-status-format "#[fg=colour8] #I #W#{?window_zoomed_flag, Z,} "
set-option -g window-status-current-format "#[fg=colour0,bg=colour4,bold] #I #W#{?window_zoomed_flag, Z,} #[default]"
set-option -g window-status-activity-style "fg=colour3"
set-option -g window-status-bell-style "fg=colour1"

# Pane borders, messages, copy-mode selection.
set-option -g pane-border-style "fg=colour8"
set-option -g pane-active-border-style "fg=colour4"
set-option -g pane-border-lines heavy
set-option -g message-style "fg=colour0,bg=colour3,bold"
set-option -g message-command-style "fg=colour3,bg=default"
set-option -g mode-style "fg=colour0,bg=colour3"
set-option -g display-panes-active-colour colour4
set-option -g display-panes-colour colour8
set-option -g clock-mode-colour colour4

#--------------------------------------------------------------------------
# Key Bindings
#--------------------------------------------------------------------------

# -r means that the bind can repeat without entering prefix again
# -n means that the bind doesn't use the prefix

set -g prefix C-a

# Send prefix to a nested tmux session by doubling the prefix
bind C-a send-prefix

# 'PREFIX r' to reload of the config file
unbind r
bind r source-file ~/.config/tmux/tmux.conf\; display-message '~/.config/tmux/tmux.conf reloaded'

# Allow holding Ctrl when using using prefix+p/n for switching windows
bind C-p previous-window
bind C-n next-window

# Move around panes like in vim
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Smart pane switching with awareness of vim splits
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Switch between previous and next windows with repeatable
bind -r n next-window
bind -r p previous-window

# resize panes more easily
bind H resize-pane -L 5
bind L resize-pane -R 5
bind J resize-pane -D 5
bind K resize-pane -U 5

# resize panes more easily with Ctrl
bind -r C-H resize-pane -L 5
bind -r C-L resize-pane -R 5
bind -r C-J resize-pane -D 5
bind -r C-K resize-pane -U 5

# Move the current window to the next window or previous window position
bind -r N run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) + 1)"
bind -r P run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) - 1)"

# Switch between two most recently used windows
bind Space last-window

# switch between two most recently used sessions
bind b switch-client -l

# break pane out of window
bind-key B break-pane -d

# put pane back into window
bind-key E command-prompt -p "join pane from: "  "join-pane -h -s '%%'"

# ── Clipboard: copy/paste like outside tmux ──────────────────────────────────
# Everything tmux copies (mouse drag, copy mode `y`) goes to the SYSTEM
# clipboard, so ⌘V / Ctrl+Shift+V pastes it anywhere:
#   1. OSC 52 escape code → the terminal sets the clipboard (iTerm2 with
#      "Applications may access clipboard", Windows Terminal, …). Also works
#      over ssh, and forwards OSC 52 from apps inside tmux (nvim, `yank`).
#   2. copy-command → a local clipboard tool, for terminals without OSC 52.
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
run-shell 'for c in pbcopy wl-copy "xclip -selection clipboard"; do \
  command -v "${c%% *}" >/dev/null 2>&1 && { tmux set -s copy-command "$c"; break; }; done'

# Mouse: drag to select → copied on release; the highlight stays until you
# click or press a key. (Hold ⌥ while dragging in iTerm2 to bypass tmux and
# use the terminal's own selection.) Double/triple click copies word/line.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear

# Keyboard (prefix [ to enter copy mode): v select, ⌃v block select, y copy.
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel
# Paste: ⌘V as usual (the terminal pastes the system clipboard), or prefix ]
# for tmux's own last copy.

# open an application in a new window with prefix+o, and allow me to provide the app name
bind-key o command-prompt -p "open app: " "new-window '%%'"

# show a promp to kill a window by id with prefix+X
bind-key X command-prompt -p "kill window: " "kill-window -t '%%'"

# use prefix+| (or prefix+\) to split window horizontally and prefix+- or
# (prefix+_) to split vertically also use the current pane path to define the
# new pane path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# change the path for newly created windows
bind c new-window -c "#{pane_current_path}"

bind C-e display-popup -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed '/^$/d' |\
    tv |\
    xargs tmux switch-client -t"

# prefix f: project jumper — pick a git repo, open/switch to a session for it.
bind f display-popup -E -w 80% -h 70% "~/.local/bin/proj --tmux"

# Move tmux status bar to top
bind-key C-k run-shell "tmux set-option -g status-position top;"
# Move tmux status bar to bottom
bind-key C-j run-shell "tmux set-option -g status-position bottom;"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# set -g @resurrect-capture-pane-contents 'on'
# Sessions: continuum saves every 15 min (or prefix ⌃s); restoring on tmux
# start is only switched on once a save exists, otherwise tmux-resurrect shows
# "resurrect file not found" on a fresh machine.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
if-shell 'test -e ~/.local/share/tmux/resurrect/last' "set -g @continuum-restore 'on'"

# TPM (plugin manager) bootstraps itself: on the first tmux start on a machine
# it clones TPM and installs every @plugin above (needs git + network). After
# that: prefix I = install new plugins, prefix U = update. Plugins live in
# ~/.config/tmux/plugins/ (gitignored).
if-shell "test ! -d ~/.config/tmux/plugins/tpm" \
  "run-shell -b 'git clone -q --depth=1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins && ~/.config/tmux/plugins/tpm/tpm && tmux display-message \"tmux plugins installed\"'" \
  "run-shell ~/.config/tmux/plugins/tpm/tpm"
