#
#  ▓▓▓▓▓▓▓▓▓▓
# ░▓ author ▓ Akash Goyal
# ░▓ file   ▓ starship/.config/starship/starship.toml
# ░▓▓▓▓▓▓▓▓▓▓
#
# Minimal, monochrome prompt: the whole line renders dimmed white, with the
# directory in bold italic, git status in italic yellow, a `took Xs` command
# duration, and subtle Nerd Font language icons. No clock / OS icon - kept
# deliberately spare. Set DOTFILES_PROMPT=p10k to use Powerlevel10k instead
# (see zsh/.config/zsh/.zshrc).

"$schema" = 'https://starship.rs/config-schema.json'

# 100ms was too tight for git_status on large repos on Windows (git.exe's own
# process-spawn overhead alone runs ~80-90ms before any actual work starts,
# per-process EDR/AV scanning on managed machines) — git_status calls were
# being killed and discarded right before finishing rather than shown. 300ms
# gives headroom once core.fsmonitor is warmed up for a repo (see
# git/.config/git/config) without masking a genuinely hung command.
command_timeout = 300
add_newline = true

# Explicit module order (dir → commit hash → status → branch → langs → duration)
# wrapped in `(dimmed white)` so the whole line is muted by default and each
# module's own style provides the accents - mirroring the reference look:
#   dotfiles (a1b2c3d) ! on  branch  took 1.2s
format = """
[$directory$git_commit$git_status$git_branch$nodejs$lua$rust$ruby$golang$package$docker_context$nix_shell$cmd_duration](dimmed white)
$character"""

# Active Python environment shown on the RIGHT edge of the prompt line instead
# of stacked below it. Covers both conda envs ($conda) and uv / `python -m venv`
# virtualenvs (custom.venv). NOTE: conda also needs telling to stop prepending
# its own "(env)" to $PS1 (that was the "(cclibs)" repeating on every Enter) —
# run this once, it's a global conda setting, not a repo file:
#   conda config --set changeps1 false
right_format = """$conda${custom.venv}"""

[directory]
style = "bold italic white"
# Show the full path from ~ (e.g. ~/ws/cc-libraries-panel/app/CSXS) instead of
# Starship's defaults, which truncate to the last 3 dirs AND cut the path at the
# git repo root (so you'd only ever see the repo folder and below).
truncate_to_repo = false
truncation_length = 0

[git_commit]
# Show a short commit hash on every prompt, not just on a detached HEAD.
only_detached = false
format = '[\($hash\)]($style) '
style = "dimmed white"

[git_branch]
style = "purple"
# Starship's built-in default symbol is a Powerline glyph that renders as a
# tofu box on fonts without that specific extension (shows up as a stray
# diamond before the branch name) — drop it rather than depend on font luck.
symbol = ""

[git_status]
style = "italic yellow"
# Disabled: staged/modified/conflicted all require a working-tree diff-index
# scan, which stays 300-650ms on large repos (illustrator, Autobot) even with
# git's fsmonitor warmed up and process-spawn overhead accounted for — that
# was the actual source of the per-Enter lag, confirmed by isolating it with
# `Measure-Command { starship prompt ... }` outside the prompt chain
# entirely. git_branch/git_commit stay on; they're single ref reads, not a
# tree walk, and cost ~80-90ms (pure process-spawn overhead, not fixable
# from here). Re-enable by deleting this line if the dirty-indicator is worth
# the latency for your workflow.
disabled = true
format = "([$ahead_behind$stashed$staged$modified$conflicted]($style) )"

[cmd_duration]
style = "italic"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](dimmed white)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold white)"

# Noise off.
[jobs]
disabled = true

# ──────────────────────────────────────────────────────────────────────────────
# Active Python environment (right side) — see right_format above
# ──────────────────────────────────────────────────────────────────────────────
[conda]
# Triggers whenever a conda env is active, in ANY directory (reads
# $CONDA_DEFAULT_ENV directly — no subprocess). ignore_base hides the noisy
# always-on "base" env.
format = "[$symbol$environment]($style)"
symbol = " "
style = "dimmed green"
ignore_base = true

[custom.venv]
# uv / `python -m venv` set $VIRTUAL_ENV; show its basename only when one is
# active (any directory). Cheap single check per render; nothing shows when no
# venv is active, so the right side stays empty unless there's something to say.
description = "Active non-conda Python virtualenv"
when = 'test -n "$VIRTUAL_ENV"'
command = 'basename "$VIRTUAL_ENV"'
format = "[ $output]($style)"
style = "dimmed green"

# ──────────────────────────────────────────────────────────────────────────────
# Language / tool markers (Nerd Font glyphs, subtle accent colors)
# ──────────────────────────────────────────────────────────────────────────────
[lua]
symbol = "󰢱 "

[ruby]
symbol = " "

[nodejs]
symbol = "󰎙 "
format = "via [$symbol](green)"

[rust]
symbol = "󱘗 "
format = "via [$symbol](red)"

[package]
symbol = "󰏗 "
format = "is [$symbol](208)$version "

[docker_context]
symbol = "󰡨 "
format = "via [$symbol](blue)"

[nix_shell]
symbol = " "
format = "via [$symbol](cyan)( $name )"

[aws]
symbol = "󰸏 "
format = "on [$symbol](yellow)($profile)"
