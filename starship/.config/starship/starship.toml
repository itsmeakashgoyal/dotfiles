#
#  ▓▓▓▓▓▓▓▓▓▓
# ░▓ author ▓ Akash Goyal
# ░▓ file   ▓ starship/.config/starship/starship.toml
# ░▓▓▓▓▓▓▓▓▓▓
#
# Minimal, monochrome prompt: the whole line renders dimmed white, with the
# directory in bold italic, git status in italic yellow, a `took Xs` command
# duration, and subtle Nerd Font language icons. No clock / OS icon - kept
# deliberately spare. Set DOTFILES_PROMPT=p10k to use Powerlevel10k instead
# (see zsh/.config/zsh/.zshrc).

"$schema" = 'https://starship.rs/config-schema.json'

# 100ms was too tight for git_status on large repos on Windows (git.exe's own
# process-spawn overhead alone runs ~80-90ms before any actual work starts,
# per-process EDR/AV scanning on managed machines) — git_status calls were
# being killed and discarded right before finishing rather than shown. 300ms
# gives headroom once core.fsmonitor is warmed up for a repo (see
# git/.config/git/config) without masking a genuinely hung command.
command_timeout = 300
add_newline = true

# Explicit module order (dir → commit hash → branch → duration) wrapped in
# `(dimmed white)` so the whole line is muted by default and each module's own
# style provides the accents:
#   dotfiles (a1b2c3d) on  branch  took 1.2s
#
# DELIBERATELY MINIMAL — every module here is either a plain env/file read or a
# single git ref read. No language/tool modules ($nodejs, $rust, $golang, …):
# starship collects a module's version eagerly as soon as the module is in this
# format string — it is NOT lazy about it, so each triggered module spawns its
# binary (`node --version`, `rustc --version`, …) on EVERY render. That is
# ~10-30ms each on macOS and far worse on Windows ARM, where Scoop installs x64
# builds that run under Prism emulation. The directory name already tells you
# what kind of project you're in, so the icons were pure cost.
# To bring one back, add it here and re-add its `[module]` block below.
format = """
[$directory$git_commit$git_branch$cmd_duration](dimmed white)
$character"""

# Active Python environment shown on the RIGHT edge of the prompt line instead
# of stacked below it. Both entries are pure environment-variable reads — no
# subprocess. NOTE: conda also needs telling to stop prepending its own "(env)"
# to $PS1 (that was the "(cclibs)" repeating on every Enter) — run this once,
# it's a global conda setting, not a repo file:
#   conda config --set changeps1 false
right_format = """$conda${env_var.venv}"""

[directory]
style = "bold italic white"
# Show the full path from ~ (e.g. ~/ws/cc-libraries-panel/app/CSXS) instead of
# Starship's defaults, which truncate to the last 3 dirs AND cut the path at the
# git repo root (so you'd only ever see the repo folder and below).
truncate_to_repo = false
truncation_length = 0

[git_commit]
# Show a short commit hash on every prompt, not just on a detached HEAD.
only_detached = false
format = '[\($hash\)]($style) '
style = "dimmed white"

[git_branch]
style = "purple"
# Starship's built-in default symbol is a Powerline glyph that renders as a
# tofu box on fonts without that specific extension (shows up as a stray
# diamond before the branch name) — drop it rather than depend on font luck.
symbol = ""

[git_status]
style = "italic yellow"
# Disabled: staged/modified/conflicted all require a working-tree diff-index
# scan, which stays 300-650ms on large repos (illustrator, Autobot) even with
# git's fsmonitor warmed up and process-spawn overhead accounted for — that
# was the actual source of the per-Enter lag, confirmed by isolating it with
# `Measure-Command { starship prompt ... }` outside the prompt chain
# entirely. git_branch/git_commit stay on; they're single ref reads, not a
# tree walk, and cost ~80-90ms (pure process-spawn overhead, not fixable
# from here). Re-enable by deleting this line if the dirty-indicator is worth
# the latency for your workflow.
disabled = true
format = "([$ahead_behind$stashed$staged$modified$conflicted]($style) )"

[cmd_duration]
style = "italic"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](dimmed white)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold white)"

# Noise off.
[jobs]
disabled = true

# ──────────────────────────────────────────────────────────────────────────────
# Active Python environment (right side) — see right_format above
# ──────────────────────────────────────────────────────────────────────────────
[conda]
# Triggers whenever a conda env is active, in ANY directory (reads
# $CONDA_DEFAULT_ENV directly — no subprocess). ignore_base hides the noisy
# always-on "base" env.
format = "[$symbol$environment]($style)"
symbol = " "
style = "dimmed green"
ignore_base = true

[env_var.venv]
# uv / `python -m venv` set $VIRTUAL_ENV. This is a plain env-var read — the
# previous [custom.venv] ran `test -n "$VIRTUAL_ENV"` and then `basename` via
# a shell on EVERY render, in every directory, which on Windows means spawning
# sh.exe twice per prompt (emulated x64 on ARM). A fixed "venv" marker costs
# nothing and says the same thing: the basename is almost always ".venv"
# anyway, and $directory already shows which project it belongs to.
variable = "VIRTUAL_ENV"
format = "[ venv]($style)"
style = "dimmed green"

# ──────────────────────────────────────────────────────────────────────────────
# Language / tool markers — intentionally NOT configured
# ──────────────────────────────────────────────────────────────────────────────
# The [lua] [ruby] [nodejs] [rust] [package] [docker_context] [nix_shell] [aws]
# blocks were removed along with their entries in `format` above. Starship only
# evaluates modules that appear in `format`, so leaving the blocks here would be
# dead config — and putting any of them back in `format` re-introduces a
# per-render subprocess (see the note on `format` at the top of this file).
#
# If you want one back, e.g. Node:
#   1. add $nodejs to `format`
#   2. add:  [nodejs]
#            symbol = "󰎙 "
#            format = "via [$symbol](green)"
# Prefer doing that only on machines where the spawn cost is acceptable — not
# on Windows ARM, where every binary Scoop installs is emulated x64.
