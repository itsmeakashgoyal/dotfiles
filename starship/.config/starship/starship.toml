#
#  ▓▓▓▓▓▓▓▓▓▓
# ░▓ author ▓ Akash Goyal
# ░▓ file   ▓ starship/.config/starship/starship.toml
# ░▓▓▓▓▓▓▓▓▓▓
#
# Gruvbox-colored prompt, built on the same zero-subprocess discipline as the
# previous monochrome version: directory → commit hash → branch → ahead/behind
# → command duration, then a newline before the input character. Still
# DELIBERATELY NO language/tool modules ($nodejs, $rust, $golang, …) — see the
# note near the bottom. Set DOTFILES_PROMPT=p10k to use Powerlevel10k instead
# (see zsh/.config/zsh/.zshrc).

"$schema" = 'https://starship.rs/config-schema.json'

# 100ms was too tight for git_status on large repos on Windows (git.exe's own
# process-spawn overhead alone runs ~80-90ms before any actual work starts,
# per-process EDR/AV scanning on managed machines) — git_status calls were
# being killed and discarded right before finishing rather than shown. 300ms
# gives headroom once core.fsmonitor is warmed up for a repo (see
# git/.config/git/config) without masking a genuinely hung command.
command_timeout = 300
add_newline = true
palette = "gruvbox_dark"

# Explicit module order (dir → commit hash → branch → duration) on one line,
# then the input character on its own line:
#   dotfiles (a1b2c3d) on  master took 1.2s
#   ❯
format = """
$directory$git_commit$git_branch$cmd_duration
$character"""

# Active Python environment shown on the RIGHT edge of the prompt line instead
# of stacked below it. Both entries are pure environment-variable reads — no
# subprocess. NOTE: conda also needs telling to stop prepending its own "(env)"
# to $PS1 (that was the "(cclibs)" repeating on every Enter) — run this once,
# it's a global conda setting, not a repo file:
#   conda config --set changeps1 false
right_format = """$conda${env_var.venv}"""

[directory]
style = "bold italic teal"
# Show the full path from ~ (e.g. ~/ws/cc-libraries-panel/app/CSXS) instead of
# Starship's defaults, which truncate to the last 3 dirs AND cut the path at the
# git repo root (so you'd only ever see the repo folder and below).
truncate_to_repo = false
truncation_length = 0

[directory.substitutions]
# Icon IN FRONT of the folder name (pure string substitution, no subprocess).
# Replacing the name with only an icon hid where you are (e.g. `~/` for
# ~/Downloads when a glyph didn't render).
"Documents" = "󰈙 Documents"
"Downloads" = "󰇚 Downloads"
"Music" = "󰝚 Music"
"Pictures" = "󰋩 Pictures"
"Developer" = "󰲋 Developer"

[git_commit]
# Show a short commit hash on every prompt, not just on a detached HEAD.
only_detached = false
format = '[\($hash\)]($style) '
style = "dimmed overlay1"

[git_branch]
# Nerd Fonts are a given in this setup (iTerm2/JetBrainsMono NF, p10k
# nerdfont-v3, Scoop Nerd Fonts on Windows — see packages.toml) so the
# plain git-branch glyph here is safe; no tofu-box risk.
symbol = " "
style = "bold lavender"

[git_status]
# Disabled: even restricted to ahead/behind only, this still shells out to
# `git status --porcelain=2` on every render (that's how Starship gets
# ahead/behind counts — the untracked = "" trick only skips git's own
# untracked-dir walk, not the status call itself), and measured ~30-40ms
# extra per prompt even in this (small) repo — confirmed slower in practice.
# git_branch/git_commit stay on; they're single ref reads, not a git
# subprocess. Re-enable by deleting this line if you want the indicator back:
disabled = true
format = "[$ahead_behind]($style)"
style = "italic"
ahead      = "[⇡${count}](teal) "
behind     = "[⇣${count}](peach) "
diverged   = "[⇕⇡${ahead_count}⇣${behind_count}](mauve) "
conflicted = ""
deleted    = ""
renamed    = ""
modified   = ""
staged     = ""
untracked  = ""
stashed    = ""

[cmd_duration]
style = "italic yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

# Noise off.
[jobs]
disabled = true

# ──────────────────────────────────────────────────────────────────────────────
# Active Python environment (right side) — see right_format above
# ──────────────────────────────────────────────────────────────────────────────
[conda]
# Triggers whenever a conda env is active, in ANY directory (reads
# $CONDA_DEFAULT_ENV directly — no subprocess). ignore_base hides the noisy
# always-on "base" env.
format = "[$symbol$environment]($style)"
symbol = " "
style = "dimmed green"
ignore_base = true

[env_var.venv]
# uv / `python -m venv` set $VIRTUAL_ENV. This is a plain env-var read — the
# previous [custom.venv] ran `test -n "$VIRTUAL_ENV"` and then `basename` via
# a shell on EVERY render, in every directory, which on Windows means spawning
# sh.exe twice per prompt (emulated x64 on ARM). A fixed "venv" marker costs
# nothing and says the same thing: the basename is almost always ".venv"
# anyway, and $directory already shows which project it belongs to.
variable = "VIRTUAL_ENV"
format = "[ venv]($style)"
style = "dimmed green"

# ──────────────────────────────────────────────────────────────────────────────
# Language / tool markers — intentionally NOT configured
# ──────────────────────────────────────────────────────────────────────────────
# The [lua] [ruby] [nodejs] [rust] [package] [docker_context] [nix_shell] [aws]
# blocks are deliberately absent, and right_format is NOT "$all" — Starship
# only evaluates modules that appear in a format string, and "$all" silently
# pulls in every non-disabled module (including every language version
# check). Each one is a per-render subprocess spawn: ~10-30ms each on macOS,
# far worse on Windows ARM, where every binary Scoop installs is emulated
# x64 under Prism. If you want one back, e.g. Node:
#   1. add $nodejs to `format`
#   2. add:  [nodejs]
#            symbol = "󰎙 "
#            format = "via [$symbol](green)"
# Prefer doing that only on machines where the spawn cost is acceptable.

[palettes.gruvbox_dark]
# Standard Gruvbox dark (medium contrast) hex values, mapped onto the same
# semantic key names used by the Catppuccin-style palettes this was adapted
# from — so swapping themes later is a palette-block swap, not a module
# rewrite. (The source this was adapted from had `base` set to a light
# cream tone by mistake; fixed here to the actual dark bg1 shade.)
overlay1 = "#a89984"  # fg4 — dim commit hash
teal     = "#8ec07c"  # bright aqua   — directory, ahead count
lavender = "#d3869b"  # bright purple — git branch
mauve    = "#d3869b"  # bright purple — diverged count
peach    = "#fe8019"  # bright orange — behind count
green    = "#b8bb26"  # bright green  — success character
red      = "#fb4934"  # bright red    — error character
yellow   = "#fabd2f"  # bright yellow — cmd_duration, vimcmd character

[palettes.gruvbox_light]
# Same keys, Gruvbox light (faded accents for contrast on the cream background).
# Not selected here: when the terminal is light (`dutils theme light|auto`),
# .zshrc points STARSHIP_CONFIG at a cached copy of this file with
# `palette = "gruvbox_light"`, so both palettes stay in this one file.
overlay1 = "#7c6f64"  # fg4
teal     = "#427b58"  # faded aqua
lavender = "#8f3f71"  # faded purple
mauve    = "#8f3f71"  # faded purple
peach    = "#af3a03"  # faded orange
green    = "#79740e"  # faded green
red      = "#9d0006"  # faded red
yellow   = "#b57614"  # faded yellow
