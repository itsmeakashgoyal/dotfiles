#
#  ▓▓▓▓▓▓▓▓▓▓
# ░▓ author ▓ Akash Goyal
# ░▓ file   ▓ starship/.config/starship/starship.toml
# ░▓▓▓▓▓▓▓▓▓▓
#
# Minimal prompt mirroring the repo's previous Powerlevel10k "lean" style:
# line 1 = os icon, directory, git branch, time (right-aligned);
# line 2 = a colored prompt character. No background pills — matches p10k's
# lean style, which uses plain foreground-colored text throughout.
#
# Colors below are the exact xterm-256 numbers the old .p10k.zsh used, not
# approximated hex, so this is a faithful port rather than a re-guess:
#   directory=31 (blue), git branch/clean=76 (green), prompt ok=76 (green),
#   prompt error=196 (red), time=66 (teal).
#
# $git_status is deliberately NOT in the format below. Unlike p10k (which
# renders an instant placeholder prompt and fills in git info async in the
# background), Starship's `$(starship prompt ...)` runs synchronously inside
# $PROMPT and blocks the next line until it returns. On a huge repo (measured:
# a 47k-tracked-file C++ monorepo) git_status alone costs ~85ms per prompt
# even with core.fsmonitor/untrackedCache on and a warm cache (vs. ~25ms for
# git_branch alone) — on rapid Enter presses that reads as real input lag,
# which is exactly what p10k's async model hid. This trades away the inline
# dirty/staged/modified markers for p10k-level responsiveness; branch name
# is unaffected.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os$directory$git_branch$fill$time
$character"""

[fill]
symbol = " "

[os]
disabled = false
format = "[$symbol](white) "

[os.symbols]
Macos = " "
Linux = " "
Windows = "󰍲 "

[directory]
style = "31"
truncation_length = 0
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "76"
format = "[$symbol$branch]($style) "

[time]
disabled = false
format = "[$time](66)"
time_format = "%I:%M:%S %p"

[character]
success_symbol = "[❯](76)"
error_symbol = "[❯](196)"
