#
#  ▓▓▓▓▓▓▓▓▓▓
# ░▓ author ▓ Akash Goyal
# ░▓ file   ▓ starship/.config/starship/starship.toml
# ░▓▓▓▓▓▓▓▓▓▓
#
# Minimal prompt mirroring the repo's previous Powerlevel10k "lean" style:
# line 1 = os icon, directory, git branch/status, time (right-aligned);
# line 2 = a colored prompt character. No background pills — matches p10k's
# lean style, which uses plain foreground-colored text throughout.
#
# Colors below are the exact xterm-256 numbers the old .p10k.zsh used, not
# approximated hex, so this is a faithful port rather than a re-guess:
#   directory=31 (blue), git branch/clean=76 (green), git modified=178
#   (gold), prompt ok=76 (green), prompt error=196 (red), time=66 (teal).
#
# $git_status was dropped once (see git log) for prompt speed on huge repos,
# then brought back by request - a branch name alone doesn't say whether the
# repo has uncommitted changes, which matters more day-to-day than the extra
# latency. Unlike p10k's async instant-prompt, `$(starship prompt ...)` runs
# synchronously in $PROMPT, so this module's cost is paid on every Enter
# press: ~25-30ms on typical repos, but measured up to ~85-90ms per prompt
# on a 47k-tracked-file C++ monorepo (with core.fsmonitor/untrackedCache on,
# Starship 1.26+, and git's fsmonitor--daemon already warm for that repo).
# The first render after that daemon has been idle for a while pays a much
# bigger one-time cost (measured 500ms-1.3s) while it cold-starts - this is
# a property of git's fsmonitor itself (raw `git status` shows the identical
# spike on that repo), not something Starship or this config causes, and it
# self-heals on the very next render. If a specific huge repo still feels
# sluggish on every render (not just the first one after a gap), the fix is
# a per-repo override (e.g. swap STARSHIP_CONFIG based on repo size in a
# chpwd hook), not silently dropping this again.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os$directory$git_branch$git_status$fill$time
$character"""

[fill]
symbol = " "

[os]
disabled = false
format = "[$symbol](white) "

[os.symbols]
Macos = " "
Linux = " "
Windows = "󰍲 "

[directory]
style = "31"
truncation_length = 0
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "76"
format = "[$symbol$branch]($style) "

[git_status]
style = "178"
# `untracked` is deliberately excluded from the format string, not just
# hidden - Starship only computes a field when it's actually referenced in
# `format`, and `untracked` is the one that requires walking the entire
# working tree against .gitignore, which is the single most expensive part
# of this module on a huge repo. Everything else here reads the already
# up-to-date git index (ahead/behind/staged/modified) or a small ref list
# (stashed), which stays fast regardless of working-tree size.
format = '([$ahead_behind$stashed$staged$modified$conflicted]($style))'
ahead = "⇢"
behind = "⇠"
diverged = "⇠⇢"
stashed = "[*${count}](76)"
staged = "+${count}"
modified = "!${count}"
conflicted = "~${count}"

[time]
disabled = false
format = "[$time](66)"
time_format = "%I:%M:%S %p"

[character]
success_symbol = "[❯](76)"
error_symbol = "[❯](196)"
